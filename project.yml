name: Turnstile

options:
  bundleIdPrefix: com.jameshiew
  deploymentTarget:
    macOS: "26.0"
  generateEmptyDirectories: false
  xcodeVersion: "26.0"

settings:
  base:
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "0.1.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  Turnstile:
    type: application
    platform: macOS
    sources:
      - path: Sources/Turnstile
        excludes:
          - Resources/Info.plist
    info:
      path: Sources/Turnstile/Resources/Info.plist
      properties:
        CFBundleDisplayName: Turnstile
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: Web URL
            CFBundleURLSchemes:
              - http
              - https
            LSHandlerRank: Alternate
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Turnstile/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jameshiew.turnstile
        PRODUCT_NAME: Turnstile

  TurnstileTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TurnstileTests
    dependencies:
      - target: Turnstile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jameshiew.turnstile.tests

schemes:
  Turnstile:
    build:
      targets:
        Turnstile: all
        TurnstileTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - TurnstileTests
